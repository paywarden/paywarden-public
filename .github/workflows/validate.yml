name: Validate exact source revision

on:
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paywarden
          POSTGRES_PASSWORD: integration-only
          POSTGRES_DB: paywarden_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U paywarden -d paywarden_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      INTEGRATION_DATABASE_URL: postgresql://paywarden:integration-only@localhost:5432/paywarden_test
      INTEGRATION_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir checkout install --frozen-lockfile
      - run: pnpm --dir dashboard install --frozen-lockfile
      - name: Validate tests, discovery, architecture and all builds
        run: node scripts/release/ci-validate.mjs
