name: Source release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    uses: ./.github/workflows/validate.yml
  docker:
    needs: validate
    uses: ./.github/workflows/build.yml
  publish:
    needs: [validate, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: node --input-type=module -e 'import fs from "node:fs"; import {requireVersion} from "./scripts/release/policy.mjs"; requireVersion(process.env.RELEASE_VERSION, JSON.parse(fs.readFileSync("package.json", "utf8")).version)'
      - name: Publish source release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        shell: bash
        run: |
          args=()
          if [[ "$RELEASE_VERSION" == *-rc.* ]]; then args+=(--prerelease); fi
          if ! gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "PayWarden $RELEASE_VERSION" --notes-file docs/release-notes.md "${args[@]}"
          fi
