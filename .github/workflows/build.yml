name: Build both Docker targets

on:
  workflow_call:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          push: false
          build-args: GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: Build migrate
        uses: docker/build-push-action@v5
        with:
          context: .
          target: migrate
          push: false
          build-args: GIT_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,mode=max,scope=migrate
