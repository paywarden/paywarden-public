services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paywarden
      POSTGRES_PASSWORD: localdev123
      POSTGRES_DB: paywarden
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paywarden"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # One-shot: applies Drizzle migrations, then exits. The app waits for it.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  webhook:
    image: node:20-alpine
    profiles: [quickstart]
    command: ["node", "/receiver/server.mjs"]
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
    volumes:
      - ./examples/webhook-receiver/node/server.mjs:/receiver/server.mjs:ro

  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Without an explicit target, docker builds the LAST stage (migrate) —
      # the app container would run drizzle-kit and exit instead of serving.
      target: runtime
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./vault:/app/vault
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  redisdata:
