# PayWarden production compose
#
# Usage:
#   Build the local runtime and migrate images first (docs/deployment.md).
#   1. Copy .env.production.example to .env.production and fill in secrets
#   2. Pin APP_IMAGE_TAG to a release version (see .github/workflows/release.yml)
#   3. docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate
#   4. docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Notes:
# - App is not exposed to the host; only Caddy publishes 80/443.
# - Postgres/Redis are internal-only (no host ports). Redis has AOF persistence
#   and a password, so pending webhook/sweep jobs survive restarts.
# - Migrations run via a one-shot `migrate` service, not on app startup.
# - Back up BOTH the Postgres volume AND the vault/ directory + .env.production.
#   The vault + env key are required to decrypt the seed; DB alone is useless.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
    networks:
      - edge
    depends_on:
      app:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redisdata:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot migration runner — uses a dedicated migrate image that ships
  # drizzle-kit + SQL files + drizzle.config.ts. The runtime `app` image does
  # NOT contain drizzle-kit (it's a devDependency) so migrations cannot run
  # from there. Build/publish the migrate image from the `migrate` Dockerfile
  # target: `docker build --target migrate -t paywarden-migrate:TAG .`
  #
  # Run with:
  #   docker compose -f docker-compose.prod.yml --env-file .env.production --profile tools run --rm migrate
  # This intentionally does NOT start automatically so deploys are explicit.
  migrate:
    image: ${MIGRATE_IMAGE:-paywarden-migrate}:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    profiles: ["tools"]
    env_file:
      - .env.production
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy

  app:
    image: ${APP_IMAGE:-paywarden}:${APP_IMAGE_TAG:?APP_IMAGE_TAG is required}
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./vault:/app/vault
    networks:
      - internal
      - edge
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  internal:
    driver: bridge
    internal: true
  edge:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
